name: CI/CD for Medical Diagnostics

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: medical_user
          POSTGRES_PASSWORD: medical_pass
          POSTGRES_DB: medical_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django coverage

    - name: Create .env file
      run: |
        echo "SECRET_KEY=test-secret-key-for-ci-cd" > .env
        echo "DEBUG=True" >> .env
        echo "ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,testserver" >> .env
        echo "DB_NAME=medical_db" >> .env
        echo "DB_USER=medical_user" >> .env
        echo "DB_PASSWORD=medical_pass" >> .env
        echo "DB_HOST=localhost" >> .env
        echo "DB_PORT=5432" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env
        echo "EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend" >> .env

    - name: Run migrations
      run: |
        python manage.py makemigrations
        python manage.py migrate

    - name: Collect static files
      run: |
        python manage.py collectstatic --noinput

    - name: Run tests
      run: |
        python manage.py test

    - name: Run server in background
      run: |
        python manage.py runserver 0.0.0.0:8000 &
        sleep 10

    - name: Check if server is running
      run: |
        curl -f http://localhost:8000/ || exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to production
      run: |
        echo "Deployment would happen here"
        # Add your deployment commands here
        # For example: docker-compose up -d, rsync, etc.